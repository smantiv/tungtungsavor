<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reservas - TungTung Savor</title>

  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>

  <!-- NAV -->
  <nav class="top-nav">
    <div class="nav-container central">

      <div class="nav-logo-row">
        <a href="index.html" class="logo-center">
          <img src="../img/logofull.png" alt="Logo">
        </a>

        <a href="rol.html" class="profile-icon right-side">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M20 21a8 8 0 1 0-16 0"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"/>
            <circle cx="12" cy="8" r="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"/>
          </svg>
        </a>
      </div>

      <ul class="menu-nav">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="menu.html">Menú</a></li>
        <li><a href="pedido.html">Pedido</a></li>
        <li><a href="reserva.html" class="activo">Reservas</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main-content">

    <div class="container-small">
      <h2 class="section-title">Formulario de Reserva</h2>

      <section class="formulario">

        <!-- FORM -->
        <form id="formReserva">

          <article class="card">

            <!-- Nombre -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <!-- Personas -->
            <label for="personas">Número de personas:</label>
            <input type="number" id="personas" min="1" required>

            <!-- Edades -->
            <label>Edades:</label>
            <div id="contenedor-edades"></div>

            <!-- Evento -->
            <label for="evento">Tipo de evento:</label>
            <select id="evento">
              <option>Cumpleaños</option>
              <option>Evento de trabajo</option>
              <option>Evento familiar</option>
              <option>Ninguno</option>
            </select>

            <!-- Fecha -->
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>

            <!-- Hora -->
            <label for="hora">Hora:</label>
            <input type="time" id="hora">

            <!-- Observaciones -->
            <label for="obs">Observaciones:</label>
            <textarea id="obs"></textarea>

            <!-- Botón -->
            <button type="submit" class="btn-submit">
              Reservar Mesa
            </button>

          </article>

        </form>
      </section>
    </div>
  </main>

  <!-- MENSAJE PANTALLA COMPLETA -->
  <div id="overlay" class="overlay oculto">
    <div class="mensaje-box">
      <h2 id="mensajeTitulo"></h2>
      <p id="mensajeTexto"></p>
    </div>
  </div>

  <footer>
    <p>© 2026 TungTung Savor</p>
  </footer>

  <!-- JS -->
  <script src="../js/Reserva.js"></script>

</body>
</html>
